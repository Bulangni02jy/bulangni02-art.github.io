name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Migrate and verify original artwork
        run: node tools/migrate-assets.mjs
      - name: Preserve artwork in this repository
        run: |
          git add site/assets
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve verified portfolio artwork and PDFs"
            git push
          fi
      - name: Build lightweight viewing images
        env:
          SHARP_MODULE_ROOT: ${{ runner.temp }}/portfolio-image-tools
        run: |
          npm install --prefix "$SHARP_MODULE_ROOT" --no-audit --no-fund --save-exact sharp@0.35.5
          node tools/optimize-images.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
